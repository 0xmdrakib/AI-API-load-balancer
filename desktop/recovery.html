<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Load Balancer — Recovery</title>
    <style>
      :root { color-scheme: light dark; font-family: Inter, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px; background: #12120f; color: #f4ecd9; }
      main { width: min(620px, 100%); padding: clamp(28px, 5vw, 52px); border: 1px solid #66572f; border-radius: 28px; background: linear-gradient(145deg, #201f19, #171713); box-shadow: 0 30px 80px #0008; }
      .mark { width: 58px; height: 58px; border-radius: 17px; overflow: hidden; box-shadow: 0 12px 28px #0005; }
      .mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
      h1 { margin: 24px 0 10px; font-size: clamp(28px, 5vw, 42px); letter-spacing: -0.04em; }
      p { color: #bdb59f; line-height: 1.65; overflow-wrap: anywhere; }
      .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      button { border: 1px solid #6c5c32; border-radius: 12px; padding: 12px 18px; font: inherit; font-weight: 700; cursor: pointer; color: #f7eed8; background: #29271f; }
      button.primary { color: #17140c; background: #d5ac4f; border-color: #d5ac4f; }
      button:focus-visible { outline: 3px solid #f6d887; outline-offset: 3px; }
      #status { min-height: 24px; margin-top: 18px; color: #e3c978; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark"><img src="../icons/icon.png" alt="AI Load Balancer" /></div>
      <h1>The interface is safe.</h1>
      <p id="reason">The isolated local backend needs attention. Saved keys and gateway configuration were not deleted.</p>
      <div class="actions">
        <button class="primary" id="retry">Retry backend</button>
        <button id="logs">Open redacted log</button>
      </div>
      <p id="status" aria-live="polite"></p>
    </main>
    <script>
      const reason = new URLSearchParams(location.search).get("reason");
      if (reason) document.querySelector("#reason").textContent = reason;
      document.querySelector("#retry").addEventListener("click", async () => {
        const status = document.querySelector("#status");
        status.textContent = "Restarting the local backend…";
        const result = await window.gatewayDesktop.retryBackend();
        if (!result.ok) status.textContent = result.error || "The backend could not restart.";
      });
      document.querySelector("#logs").addEventListener("click", () => window.gatewayDesktop.openLogs());
    </script>
  </body>
</html>
